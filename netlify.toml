[build]
  publish = "public"
  functions = "netlify/functions"

# Functions declare their own routes via `export const config = { path: ... }`,
# so no redirect rules are needed here.

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
